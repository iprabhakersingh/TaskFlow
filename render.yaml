services:
  # PostgreSQL
  - type: pserv
    name: taskflow-db
    plan: free

  # Redis (Render Key Value)
  - type: keyvalue
    name: taskflow-redis
    plan: free
    ipAllowList: []

  # FastAPI Web Service
  - type: web
    name: taskflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflow-redis
          property: connectionString

      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

  # Celery Worker
  - type: worker
    name: taskflow-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.core.celery_app:celery_app worker --loglevel=info
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflow-redis
          property: connectionString

      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

  # Celery Beat
  - type: worker
    name: taskflow-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.core.celery_app:celery_app beat --loglevel=info
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: taskflow-redis
          property: connectionString

      - key: SECRET_KEY
        sync: false

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
